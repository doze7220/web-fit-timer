<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFitTimer</title>
    <meta name="description" content="A highly visible and advanced fitness timer application.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="wftimer.png">
    <link rel="shortcut icon" type="image/x-icon" href="wftimer.ico?v=1.8.0">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <h1 class="logo">FIT<span>TIMER</span></h1>
            <nav id="day-selector" class="day-selector">
                <!-- Days will be generated by JS -->
            </nav>
            <div class="export-container">
                <button id="btn-export" class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    保存 (Export)
                </button>
                <button id="btn-reset" class="btn btn-secondary"
                    style="margin-top: 12px; color: var(--phase-work); border-color: rgba(239, 68, 68, 0.3);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <polyline points="3 3 3 8 8 8"></polyline>
                    </svg>
                    再読込 (Reload)
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header glass-panel">
                <h2 id="current-day-name">Select a Day</h2>
            </header>

            <div class="content-grid">
                <!-- Editor / Menu List -->
                <section class="editor-section glass-panel">
                    <div class="editor-header">
                        <h3>Exercises</h3>
                        <div id="global-prep-container"></div>
                    </div>
                    <div id="exercise-list" class="exercise-list">
                        <!-- Exercises injected here -->
                    </div>
                </section>

                <!-- Timer -->
                <section class="timer-section glass-panel" id="timer-section">
                    <div class="timer-display-container" id="timer-display-container">
                        <div class="phase-badge" id="phase-badge" style="color: var(--phase-idle)">IDLE</div>

                        <div class="time-circle" id="time-circle">
                            <svg class="progress-ring" width="280" height="280">
                                <circle class="progress-ring__circle_bg" stroke="rgba(255,255,255,0.1)" stroke-width="8"
                                    fill="transparent" r="130" cx="140" cy="140" />
                                <circle class="progress-ring__circle" id="progress-ring" stroke="var(--phase-idle)"
                                    stroke-width="8" fill="transparent" r="130" cx="140" cy="140" />
                            </svg>
                            <div class="time-circle-content">
                                <div class="time-text">
                                    <span id="time-left">00:00</span>
                                    <span id="time-ms" class="time-ms">.00</span>
                                </div>
                                <div class="timer-status-icon" id="timer-status-icon"
                                    style="color: var(--text-muted); margin-top: 8px;">
                                    <svg class="icon-play" id="circle-icon-play" width="32" height="32"
                                        viewBox="0 0 24 24" fill="currentColor">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                    <svg class="icon-pause hidden" id="circle-icon-pause" width="32" height="32"
                                        viewBox="0 0 24 24" fill="currentColor">
                                        <rect x="6" y="4" width="4" height="16"></rect>
                                        <rect x="14" y="4" width="4" height="16"></rect>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <div class="rep-info">
                            <div class="rep-count">Rep: <span id="current-rep">0</span> / <span id="total-reps">0</span>
                            </div>
                            <div class="set-count">Set: <span id="current-set">0</span> / <span id="total-sets">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="timer-controls">
                        <button id="btn-next-set" class="btn btn-secondary" title="次セット">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polygon points="13 19 22 12 13 5 13 19"></polygon>
                                <polygon points="2 19 11 12 2 5 2 19"></polygon>
                            </svg>
                            <span style="font-size: 14px; margin-left: 4px;">次セット</span>
                        </button>
                        <button id="btn-next-exercise" class="btn btn-secondary" title="次メニュー">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                                <line x1="19" y1="5" x2="19" y2="19"></line>
                            </svg>
                            <span style="font-size: 14px; margin-left: 4px;">次メニュー</span>
                        </button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="changelog.js"></script>
    <script src="app.js"></script>
</body>

</html>
